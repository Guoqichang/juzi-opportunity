name: juzi-opportunity

x-app: &app
  image: juzi-opportunity:${POLICY_RELEASE:-v0.2.0}
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  volumes:
    - ${POLICY_DATA_PATH:-./data}:/data
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  web:
    <<: *app
    environment:
      POLICY_DATA_DIR: /data
      POLICY_DEPLOYMENT: server
      POLICY_ALLOWED_HOSTS: ${POLICY_DOMAIN:?Set POLICY_DOMAIN to the exact domain}
      # This container is reachable only over the dedicated Compose network.
      FORWARDED_ALLOW_IPS: "*"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/api/status', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  worker:
    <<: *app
    command: [policy, worker]
    environment:
      POLICY_DATA_DIR: /data
      POLICY_DNS_MODE: ${POLICY_DNS_MODE:-system}
    depends_on:
      web:
        condition: service_healthy
    stop_grace_period: 5m
    healthcheck:
      test: [CMD, python, -c, "import sqlite3,json,datetime; c=sqlite3.connect('file:/data/policy.db?mode=ro',uri=True); r=c.execute('select value,updated_at from runtime_state where key=?',('worker',)).fetchone(); assert r and json.loads(r[0])['state']=='running' and (datetime.datetime.now(datetime.UTC)-datetime.datetime.fromisoformat(r[1])).total_seconds()<45"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      POLICY_DOMAIN: ${POLICY_DOMAIN:?Set POLICY_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
